# 학교 서버 등 포트를 하나만 쓸 수 있는 환경용 구성.
# 화면과 API를 같은 주소에서 서빙한다.
#
#   http://서버:8080/            -> 대시보드 화면
#   http://서버:8080/client-api  -> 화면이 쓰는 API
#   http://서버:8080/api         -> 센서 노드(ESP32)가 쓰는 API
#
# 실행:  docker compose up -d --build
# 확인:  curl http://localhost:8080/health

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # 빌드할 때 호스트 네트워크를 그대로 쓴다.
      # 학교망처럼 Docker 기본 브리지에서 바깥으로 못 나가는 환경이 있는데,
      # 그러면 프론트를 받아오는 git clone 이 "Connection reset by peer" 로 죽는다.
      # 호스트에서 git pull 이 되는 곳이면 이 설정으로 통과한다.
      network: host
      args:
        # 프론트를 이 접두사로 빌드한다. 아래 COMPAT_API_PREFIX 와 반드시 같아야 한다.
        API_PREFIX: /client-api
    # 아래 simulator 가 이 이미지를 그대로 쓴다 (따로 빌드하지 않는다)
    image: smart-energy-backend:latest
    container_name: smart-energy-backend
    restart: unless-stopped
    ports:
      # 왼쪽이 서버에서 열어둔 포트, 오른쪽은 컨테이너 안 포트(고정)
      - "8080:8000"
    environment:
      # SQLite 파일을 볼륨에 둔다. 슬래시 4개 = 절대경로
      DATABASE_URL: sqlite:////data/smart_energy.db

      # 프론트를 함께 서빙하므로 화면 경로와 겹치지 않게 API를 접두사 아래로 내린다
      COMPAT_API_PREFIX: /client-api
      COMPAT_API_ENABLED: "true"
      FRONTEND_DIR: web

      # 토큰 서명 키. 비워두면 재시작할 때마다 로그인이 전부 풀린다.
      # 반드시 길고 예측 불가능한 값으로 바꿀 것.
      AUTH_SECRET: 여기를_긴_랜덤_문자열로_바꾸세요

      # 공개 서버이므로 demo 계정은 끄고 관리자 계정을 직접 만든다
      AUTH_DEMO_ACCOUNT: "false"
      AUTH_BOOTSTRAP_ADMIN_ID: admin
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: 8자이상_비밀번호로_바꾸세요

      # 화면을 같은 주소에서 주므로 교차 출처 요청이 없다. 필요해지면 도메인을 적을 것.
      CORS_ORIGINS: "*"

      # ---- 메일 (비밀번호 찾기 · 이메일 인증) ----
      # 여기를 비워두면 메일을 보내지 않고 링크를 컨테이너 로그에만 남긴다.
      # 확인:  docker compose logs backend | grep -A6 "SMTP 미설정"
      # 그 상태로도 흐름은 전부 동작하지만, 사용자는 링크를 받을 수 없다.
      #
      # Gmail 을 쓴다면 2단계 인증을 켠 뒤 "앱 비밀번호" 를 만들어 넣을 것.
      # 계정 비밀번호로는 로그인되지 않는다.
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: "587"
      # SMTP_USERNAME: 보내는주소@gmail.com
      # SMTP_PASSWORD: 앱_비밀번호_16자리
      # SMTP_FROM: 보내는주소@gmail.com

      # 메일 본문에 넣을 링크의 앞부분. 사용자가 브라우저로 여는 주소여야 한다.
      # 비워두면 요청 주소에서 유추하는데, 프록시 뒤에서는 틀린 주소가 나간다.
      PUBLIC_BASE_URL: http://service.gsmsv.site:33141

      # 컨테이너 안에 브로커가 없다. ESP32는 HTTP(/api/sensors/data)로 붙인다.
      # MQTT를 쓰려면 mosquitto 서비스를 추가하고 MQTT_HOST를 그 이름으로 지정할 것.
      MQTT_ENABLED: "false"
    volumes:
      - sqlite-data:/data

  # 시연용 가상 노드.
  #
  # 실물 ESP32 없이 조명 켜기/끄기가 "완료"까지 가는 걸 보여준다.
  # 제어는 노드가 명령을 가져가야 완료되는데, 붙어 있는 노드가 없으면
  # 화면은 15초 뒤 "응답 없음"만 띄운다.
  #
  # 평소에는 뜨지 않는다. 시연할 때만 켠다:
  #     docker compose --profile demo up -d
  # 끌 때:
  #     docker compose --profile demo stop simulator
  simulator:
    profiles: ["demo"]
    # backend 와 똑같은 이미지다. build 를 같이 적어두면 이미지가 아직 없을 때
    # Docker Hub 에서 받으려다 실패하는 일이 없다 (이미 만들어져 있으면 캐시로 즉시 끝난다).
    image: smart-energy-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        API_PREFIX: /client-api
    container_name: smart-energy-simulator
    restart: unless-stopped
    depends_on:
      - backend
    # 폴링을 5초로 둔다. 화면이 15초 만에 포기하므로 그보다 넉넉히 짧아야 한다.
    command: >
      python scripts/simulate_http_node.py
      --base-url http://backend:8000
      --node-key SIM-NODE-102
      --space-id 1
      --interval 5
      --poll-interval 5

volumes:
  sqlite-data:
