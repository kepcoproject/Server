# 푸시할 때마다 테스트를 돌린다. 배포 전에 깨진 걸 먼저 잡기 위한 것이다.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # MQTT 브로커가 없는 환경이라 수집은 꺼두고 돌린다.
      - run: pytest -q
        env:
          MQTT_ENABLED: "false"
          AUTH_SECRET: ci-test-secret-not-used-in-production
